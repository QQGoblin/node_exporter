server:
  image:
    repository: registry.lqingcloud.cn/library/prometheus
  service:
    enabled: true
    type: NodePort

  extraVolumeMounts:
    - name: ccptls
      mountPath: /etc/rcos_global/tls_key
      readOnly: false

  extraVolumes:
    - name: ccptls
      hostPath:
        path: /etc/rcos_global/tls_key      # 挂载主机根目录，可根据需要修改为具体目录
        type: Directory

configmapReload:
  prometheus:
    enabled: false

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

serverFiles:
  alerting_rules.yml: {}
  alerts: {}

  recording_rules.yml: {}
  rules: {}

  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts

    scrape_configs:
      # 获取主机 node-exporter 数据
      - job_name: 'static'
        scrape_interval: 15s
        scrape_timeout: 10s
        static_configs:
          - targets: ['172.28.71.19:9100']
        relabel_configs:
          - source_labels: [__address__]
            regex: '([0-9.]+):9100'
            target_label: ip
            replacement: '$1'

